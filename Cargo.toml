[workspace]
members = [
    "orderbook",
    "cli",
    "exchange-service",
]

[package]
name = "hftx"
version = "0.1.0"
edition = "2021"

[dependencies]
orderbook = { path = "orderbook" }
tokio = { version = "1.0", features = ["full"] }
axum = { version = "0.7", features = ["ws"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.0", features = ["v4"] }
tracing = "0.1"
tracing-subscriber = "0.3"
tower = "0.4"
tower-http = { version = "0.5", features = ["cors"] }
futures = "0.3"

# Compute-bound matching engine: trade compile time for run-time latency.
# `lto = "fat"` lets the optimizer inline across the orderbook crate boundary
# (the hot `submit`/`fill_front` path lives there); `codegen-units = 1` removes
# the parallel-codegen optimization barrier. panic stays "unwind" on purpose —
# a panic in one request/task must not abort the whole service.
[profile.release]
lto = "fat"
codegen-units = 1

# Criterion builds benches under the `bench` profile, which does NOT inherit
# custom keys from `[profile.release]`. Mirror them so benchmark numbers reflect
# what production actually runs.
[profile.bench]
lto = "fat"
codegen-units = 1
