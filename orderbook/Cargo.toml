[package]
name = "orderbook"
version = "0.1.0"
edition = "2021"

[dependencies]
# `rc` enables (de)serialization of Arc<str>, used for the interned symbol so a
# trade can share the book's symbol via an atomic refcount instead of a heap copy.
serde = { version = "1.0", features = ["derive", "rc"] }
# Fast, non-cryptographic hasher for the id index / cancel set. These maps are
# touched on every push/pop; std's default SipHash over u128 keys is pure overhead.
rustc-hash = "2"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "orderbook_bench"
harness = false
